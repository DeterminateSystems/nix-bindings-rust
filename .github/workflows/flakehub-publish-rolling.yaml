name: Publish every Git push to integration to FlakeHub
on:
  push:
    branches:
      - integration
jobs:
  flakehub-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-push@main
        with:
          name: DeterminateSystems/nix-bindings-rust
          rolling: true
          visibility: private
          include-output-paths: true

